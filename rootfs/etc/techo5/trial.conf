# Slot trial (etc/techo5/boot.sh). A new slot commits only once the supervisor has run five minutes
# AND there is a default route: a slot whose Wi-Fi does not come up (the driver does not fit the
# kernel, say) uses up its three tries and the unit falls back to the previous slot on its own,
# rather than staying up and unreachable.
TRIAL_SETTLE=300
TRIAL_TIMEOUT=900
TRIAL_NEEDS_NETWORK=1
