# echo-penguin settings. The image's defaults; override any of them in /data/penguin/settings.conf
# (same syntax, survives updates). `penguin settings` shows the effective values.

# Docker: auto (started when the kernel has namespaces, i.e. the docker boot image) | off.
DOCKER=auto

# SSH (dropbear, keys only: no password ever works). SSH=off stops it and closes port 22; the USB
# console and the screen still work, and `penguin ssh on` (or the screen) turns it back on.
# SSH_ALLOW: the computers allowed to connect, space-separated MAC addresses (aa:bb:cc:dd:ee:ff)
# and/or IPv4/IPv6 addresses or networks (192.168.1.20, 192.168.1.0/24). Empty: any device on the
# Wi-Fi network may try, and still needs an authorized key. Prefer MAC addresses on the same Wi-Fi
# (an IP from DHCP can be handed to another device later). Set it with `penguin ssh allow`, which
# refuses a list that would lock out the session it runs in; `penguin ssh allow here` adds this
# session's computer.
SSH=on
SSH_ALLOW=""

# Wi-Fi firewall. Inbound on wlan0 is closed except SSH (22) and these TCP ports, space-separated.
LAN_PORTS=""
# Ports published by containers (docker run -p): 0 = refused from Wi-Fi (reachable through an SSH
# tunnel), 1 = open on Wi-Fi.
DOCKER_LAN=0

# Hardware (validated-hardware.md).
CPU_ONLINE="2 3"        # cores 2 and 3 are offline by default; bring them up
ZRAM_MB=480             # swap in zram, as Android had (plan, Stage 4.3)
BACKLIGHT=90            # 0-255 (with AUTO_BRIGHTNESS=1: in a lit room); 0 = screen off (and blanked)
WATCHDOG=1              # feed /dev/watchdog; the unit restarts if userspace hangs
TEMP_ZONE=12            # thermal_zone12 = mtktscpu
TEMP_WARN=75            # degrees C: logged
TEMP_CRIT=85            # degrees C: running containers are paused until the CPU is back at TEMP_WARN

# Weekly restart (plan, Stage 8.3): day of week (0 = Sunday) and hour, local time. Empty: never.
WEEKLY_REBOOT_DAY=0
WEEKLY_REBOOT_HOUR=4

# Logs on userdata, rotated at this size (bytes), one old generation kept.
LOG_MAX=2000000

# Screen. SCREEN_UI=1: the touch interface (penguin-ui) on the panel, and the log console (kernel
# errors, boot log, mirrored sessions) one tap away on tty2. SCREEN_UI=0: the panel is the log
# console itself. SCREEN_MIRROR=1 shows every interactive SSH and USB-console session on the log
# console: what is typed and its output. SCREEN_LOGLEVEL: after boot, kernel messages more urgent
# than this reach the log console (default 4: errors and worse; 8 = all, 1 = none).
SCREEN_UI=1
SCREEN_MIRROR=1
SCREEN_LOGLEVEL=4

# Automatic brightness (the touch interface, so SCREEN_UI=1). AUTO_BRIGHTNESS=1: the screen follows
# the room's light sensor, from BACKLIGHT_DARK (1-255) when the room is dark up to BACKLIGHT when it
# is lit, with a short fade; 0: it stays at BACKLIGHT. LIGHT_DARK and LIGHT_BRIGHT are the sensor's
# readings (0-4095, shown under Display & sound) taken as dark and as lit; in between, the level
# moves along a log scale. Raise LIGHT_DARK if the screen stays bright with the lights off.
AUTO_BRIGHTNESS=1
BACKLIGHT_DARK=10
LIGHT_DARK=3
LIGHT_BRIGHT=80

# Sound: the amplifier's volume at boot, 0-100 (penguin-sound volume; the UI and the volume buttons
# change it).
VOLUME=50

# Gradual wake (the touch interface's alarms: a tap anywhere, or a volume button, stops a ringing
# alarm; one nobody answers stops after 10 minutes). WAKE_LIGHT: minutes before an alarm the screen
# starts a "sunrise" (warm colours, the backlight climbing from BACKLIGHT_DARK to BACKLIGHT, even from
# Screen off) once it has not been touched for 30 s; 0 = off. WAKE_RAMP: seconds the alarm's volume
# takes to climb to VOLUME; 0 = it rings at VOLUME at once. WAKE_VOLUME_START: where it starts, in
# percent of VOLUME on the amplifier's own scale (VOLUME's 0-100, about 1.6 dB a point on the
# TAS5805M): 80 with VOLUME=50 starts at 40, about 16 dB under; 100 = no ramp.
WAKE_LIGHT=10
WAKE_RAMP=60
WAKE_VOLUME_START=80

# Night clock. NIGHT_CLOCK=auto: when the room is dark (light sensor at LIGHT_DARK or less; lit again
# above twice that, at least LIGHT_DARK+3) and the screen has not been touched for 30 s, it shows only
# a dim clock and the next alarm; on: whenever it has not been touched for 30 s; off: never. A tap
# brings the interface back. NIGHT_COLOR: red | amber.
NIGHT_CLOCK=auto
NIGHT_COLOR=red

# Weather on the home screen (Open-Meteo, no account): the place's latitude and longitude in decimal
# degrees, and its name. Empty: no weather. `penguin-weather set CITY` fills in all three.
WEATHER_LAT=""
WEATHER_LON=""
WEATHER_PLACE=""

# Speech (espeak-ng). SPEAK_ALARM=1: after an alarm is stopped by hand, the time and the weather are
# said; 0: silent. Tapping the home screen's clock says them too. SPEAK_VOICE: the espeak-ng voice
# (en, pt-br, es, ...); the spoken text follows its language (pt*: Portuguese, else English).
SPEAK_ALARM=1
SPEAK_VOICE=en

# Sleep diary. SLEEP_LOG=1: the room going dark and lit again (light sensor, steady for 2 min) and the
# alarms' rings and stops are recorded in /data/penguin/sleep-log.jsonl; the Clock screen's
# Sleep tab and `penguin-sleep nights` show the nights. 0: nothing is recorded.
SLEEP_LOG=1
